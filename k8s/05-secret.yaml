# Les données sensibles vont dans un Secret (encodées base64).
# Ici : l'URL de connexion à la base. Dans un vrai projet avec Postgres,
# ce serait le DSN avec mot de passe.
apiVersion: v1
kind: Secret
metadata:
  name: campusconnect-secret
  namespace: campusconnect
type: Opaque
stringData:
  DATABASE_URL: "file:/app/data/dev.db"   # stringData = encodage b64 automatique
