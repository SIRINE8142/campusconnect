# Valeurs par défaut du chart — surchargeables avec --set ou -f custom-values.yaml

replicaCount: 1   # ne pas augmenter : SQLite + volume ReadWriteOnce = 1 seul pod

image:
  repository: campusconnect
  tag: latest
  pullPolicy: IfNotPresent   # image construite localement (minikube image build)

service:
  type: ClusterIP
  port: 80
  targetPort: 3000
  nodePort: 30080            # utilisé seulement si type: NodePort

ingress:
  enabled: true
  className: nginx
  host: campusconnect.local

# ConfigMap — configuration non sensible
app:
  nodeEnv: production
  runSeed: "true"            # seed de démo au premier démarrage

# Secret — configuration sensible (encodée base64 dans le manifeste)
database:
  url: "file:/app/data/dev.db"

persistence:
  enabled: true
  storageClassName: ""       # "" = PV statique ; mettre "standard" pour dynamique
  size: 500Mi
  hostPath: /data/campusconnect   # chemin hôte Minikube pour le PV statique
