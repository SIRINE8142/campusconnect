apiVersion: v1
kind: Secret
metadata:
  name: {{ include "campusconnect.fullname" . }}-secret
  labels:
    {{- include "campusconnect.labels" . | nindent 4 }}
type: Opaque
data:
  # b64enc : les valeurs Secret doivent être encodées en base64
  DATABASE_URL: {{ .Values.database.url | b64enc | quote }}
