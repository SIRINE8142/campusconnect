apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "campusconnect.fullname" . }}-config
  labels:
    {{- include "campusconnect.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.app.nodeEnv | quote }}
  PORT: {{ .Values.service.targetPort | quote }}
  RUN_SEED: {{ .Values.app.runSeed | quote }}
  NEXT_TELEMETRY_DISABLED: "1"
