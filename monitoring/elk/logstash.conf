# Pipeline Logstash : reçoit les logs de Filebeat (port 5044),
# tague les logs du conteneur CampusConnect, les indexe dans Elasticsearch.
input {
  beats {
    port => 5044
  }
}

filter {
  # Ne garder que les logs de notre application
  if [container][image][name] =~ /campusconnect/ {
    mutate { add_tag => ["campusconnect"] }
  }
}

output {
  if "campusconnect" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "campusconnect-%{+YYYY.MM.dd}"
    }
  }
}
