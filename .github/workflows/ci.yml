name: CI

# Pipeline déclenchée à chaque push sur main et sur chaque PR :
# installation → base de test → lint → tests → build.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Dépendances (npm ci + prisma generate)
        run: npm ci

      - name: Base SQLite pour le build
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Tests unitaires + intégration (Vitest)
        run: npm test

      - name: Build de production
        run: npm run build

      # Étape optionnelle : vérifier que l'image Docker se construit
      - name: Build de l'image Docker
        run: docker build -t campusconnect .
